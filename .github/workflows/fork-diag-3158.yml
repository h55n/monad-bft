name: Fork diag 3158 (wireauth failure reason)
on:
  workflow_dispatch:
  push:
    branches: [ci-diag-3158]
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang pkg-config libssl-dev protobuf-compiler
      - name: Default limits, show error text
        continue-on-error: true
        run: |
          cargo test -p monad-raptorcast --test wireauth_raptorcast -- --nocapture --test-threads=1 > /tmp/w.log 2>&1 || true
          grep -m3 -A2 "Failed building the Runtime" /tmp/w.log | cut -c1-300
          grep -E "^test result" /tmp/w.log
      - name: Raised memlock, same test
        continue-on-error: true
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ulimit -l
          cargo test -p monad-raptorcast --test wireauth_raptorcast > /tmp/w2.log 2>&1 || true
          grep -E "^test result|FAILED" /tmp/w2.log
