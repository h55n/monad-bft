name: Fork full raptorcast tests with memlock raised
on:
  workflow_dispatch:
  push:
    branches: [ci-diag-3158]
jobs:
  full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang pkg-config libssl-dev protobuf-compiler
      - name: Raise memlock for this shell (runner default 8 MiB causes io_uring ENOMEM)
        run: echo skip
      - name: Head, all monad-raptorcast tests, no skips
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          echo "memlock=$(ulimit -l)"
          git log -1 --format=%h
          cargo test -p monad-raptorcast --all-targets --no-fail-fast 2>&1 | tee /tmp/h.log | grep -E "^test result|FAILED|Running"
          test ${PIPESTATUS[0]} -eq 0
      - name: Base, wireauth for comparison
        continue-on-error: true
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          git checkout -q 796f2d0 -- monad-raptorcast
          cargo test -p monad-raptorcast --test wireauth_raptorcast 2>&1 | grep -E "^test result|FAILED"
