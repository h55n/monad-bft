name: Fork CI
on: [push]
env:
  ASMFLAGS: -march=haswell
  CC: gcc-15
  CFLAGS: -march=haswell
  CXX: g++-15
  CXXFLAGS: -march=haswell
  RUSTFLAGS: -C target-cpu=haswell
  TRIEDB_TARGET: triedb_driver
jobs:
  rpc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update && sudo apt-get install -y \
            libboost-fiber1.83.0 \
            libboost-json1.83.0 \
            libboost-stacktrace1.83.0 \
            libboost-fiber1.83-dev \
            libboost-json1.83-dev \
            libboost-stacktrace1.83-dev \
            libboost1.83-dev \
            libbenchmark-dev \
            libcgroup-dev \
            libgmock-dev \
            libgtest-dev \
            libtbb-dev \
            liburing-dev \
            libarchive-dev \
            libbrotli-dev \
            libcap-dev \
            libcli11-dev \
            libcrypto++-dev \
            libgmp-dev \
            libsecp256k1-dev \
            libzstd-dev \
            clang-19 \
            libclang-19-dev \
            gcc-15 \
            g++-15 \
            libhugetlbfs-dev \
            libmagicenum-dev \
            libsecp256k1-dev
      - run: sudo apt-get install -y libssl-dev pkg-config protobuf-compiler cmake
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install nightly-2025-12-09 --profile minimal --component rustfmt
      - name: Format
        run: cargo +nightly-2025-12-09 fmt --all --check
      - name: Lint
        run: >
          cargo clippy -p monad-rpc --all-targets --no-default-features --
          -D clippy::suspicious -D clippy::style -D clippy::clone_on_copy -D clippy::redundant_clone
          -D clippy::iter_kv_map -D clippy::iter_nth -D clippy::unnecessary_cast -D clippy::filter_next
          -D clippy::needless_lifetimes -D clippy::useless_conversion -D clippy::useless_vec
          -D clippy::needless_question_mark -D clippy::bool_comparison
          -D unused_imports -D unused_parens -D deprecated
          -A clippy::type_complexity -A clippy::int_plus_one -A clippy::uninlined-format-args
          -A clippy::enum-variant-names -A clippy::mutable_key_type -A clippy::large_enum_variant
          -A clippy::doc-overindented-list-items
      - run: cargo test -p monad-rpc --no-default-features
